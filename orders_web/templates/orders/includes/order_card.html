<article class="card entity-card h-100"><div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between gap-2"><span class="entity-id">{{ order.id }}</span><span class="badge {% if order.status == 'Отменён' %}text-bg-secondary{% else %}text-bg-success{% endif %}">{{ order.status }}</span></div>
    <h2 class="h5 mt-2">Заказ по заявке {{ order.application.id }}</h2>
    <p class="mb-1">Поставщик: {{ order.supplier.name }}</p><p class="price-value">{{ order.total|floatformat:2 }} ₽</p>
    <a class="btn btn-outline-primary align-self-start mt-auto" href="{% url 'orders:detail' order.id %}">Подробнее</a>
</div></article>
