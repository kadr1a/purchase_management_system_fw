<article class="card entity-card h-100"><div class="card-body d-flex flex-column">
    <span class="entity-id">{{ order.id }}</span>
    <h2 class="h5 card-title">{{ order.purpose }}</h2>
    <p>Поставщик: {{ order.supplier_name }}</p><p>Статус: {{ order.status }}</p>
    <p class="price-value">{{ order.total|floatformat:2 }} ₽</p>
    <a class="btn btn-outline-primary align-self-start" href="{% url 'orders:detail' order.id %}">Подробнее</a>
</div></article>
