<article class="card entity-card h-100"><div class="card-body d-flex flex-column">
    <span class="entity-id">{{ supplier.id }}</span>
    <h2 class="h5 card-title">{{ supplier.name }}</h2>
    <p>Контакт: {{ supplier.contact|default:"Не указан" }}</p>
    <p class="text-muted flex-grow-1">Рейтинг: {{ supplier.rating }}/5</p>
    <a class="btn btn-outline-primary align-self-start" href="{% url 'suppliers:detail' supplier.id %}">Подробнее</a>
</div></article>
