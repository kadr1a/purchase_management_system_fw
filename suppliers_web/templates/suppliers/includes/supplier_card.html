<article class="card entity-card h-100"><div class="card-body d-flex flex-column">
    <span class="entity-id">{{ supplier.id }}</span><h2 class="h5">{{ supplier.name|default:"Без названия" }}</h2>
    <p class="mb-2">{{ supplier.contact|default:"Контакт не указан" }}</p>
    <p class="rating-value">Рейтинг: {{ supplier.rating }}/5</p>
    <a class="btn btn-outline-primary align-self-start mt-auto" href="{% url 'suppliers:detail' supplier.id %}">Подробнее</a>
</div></article>
