<article class="card entity-card h-100">
    <div class="card-body d-flex flex-column">
        {% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid rounded mb-3" style="max-height: 150px; object-fit: contain">{% endif %}
        <span class="entity-id">{{ product.id }}</span>
        <h2 class="h5 card-title">{{ product.name|default:"Без названия" }}</h2>
        <p class="price-value">{{ product.price|floatformat:2 }} ₽</p>
        <p class="text-muted flex-grow-1">{{ product.description|default:"Описание не указано" }}</p>
        <a class="btn btn-outline-primary align-self-start" href="{{ product.get_absolute_url }}">Подробнее</a>
    </div>
</article>
