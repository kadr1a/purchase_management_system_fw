{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Система управления закупками{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'homepage/css/style.css' %}" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container py-3">
            <a class="brand-link" href="{% url 'homepage:index' %}">
                <img src="{% static 'homepage/img/logo.png' %}" alt="Логотип системы закупок" class="site-logo">
                <span>Закупки</span>
            </a>
        </div>
        {% include "includes/navigation.html" %}
    </header>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container py-3">
            <span>© <span id="current-year"></span> Система управления закупками</span>
            <span class="footer-note">Учёт товаров, поставщиков, заявок и заказов</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
