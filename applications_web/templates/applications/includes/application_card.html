<article class="card entity-card h-100"><div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between gap-2"><span class="entity-id">{{ application.id }}</span><span class="badge text-bg-info">{{ application.status }}</span></div>
    <h2 class="h5 mt-2">{{ application.purpose|default:"Назначение не указано" }}</h2>
    <p class="text-muted">Позиций: {{ application.product_items|length }}</p>
    <p class="price-value">{{ application.calculate_total|floatformat:2 }} ₽</p>
    <a class="btn btn-outline-primary align-self-start mt-auto" href="{% url 'applications:detail' application.id %}">Состав заявки</a>
</div></article>
