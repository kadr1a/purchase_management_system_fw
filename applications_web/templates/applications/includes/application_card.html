<article class="card entity-card h-100"><div class="card-body d-flex flex-column">
    <span class="entity-id">{{ application.id }}</span>
    <h2 class="h5 card-title">{{ application.purpose }}</h2>
    <p>Статус: {{ application.status }}</p>
    <p>Товарных позиций: {{ application.item_count }}</p>
    <p class="price-value">{{ application.application_total|floatformat:2 }} ₽</p>
    <a class="btn btn-outline-primary align-self-start" href="{% url 'applications:detail' application.id %}">Подробнее</a>
</div></article>
